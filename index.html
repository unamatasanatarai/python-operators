<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Operators Reference | Modern Python Guide</title>
    <meta name="description"
        content="A fast, modern, and interactive reference guide for all Python operators. Filter, search, and learn with examples.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Operator categories">
                <h2 class="sidebar-title">Categories</h2>
                <div id="category-filters" class="sidebar-list">
                    <!-- Dynamically populated -->
                </div>
            </nav>
        </aside>

        <div class="main-wrapper">
            <header class="main-header">
                <div class="header-content">
                    <h1>Python Operators</h1>
                    <div class="controls">
                        <div class="search-container">
                            <input type="text" id="search-input" placeholder="Search Python operators..."
                                aria-label="Search operators">
                            <div class="search-addons">
                                <kbd>/</kbd>
                                <button id="random-btn" class="icon-link" title="Pick a random operator">
                                    <svg viewBox="0 0 24 24" width="20" height="20">
                                        <path fill="currentColor"
                                            d="M10.59,9.17L5.41,4L4,5.41l5.17,5.17L10.59,9.17z M14.5,4l2.04,2.04L4,18.59L5.41,20L17.96,7.45L20,9.5V4H14.5z M14.83,13.41l-1.41,1.41l3.13,3.13L14.5,20H20v-5.5l-2.04,2.04L14.83,13.41z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <main id="app-container">
                <section id="operator-grid" class="operator-grid">
                    <!-- Dynamically populated -->
                    <div class="loader">Loading operators...</div>
                </section>

                <section id="empty-state" class="empty-state hidden">
                    <div class="empty-content">
                        <span class="empty-icon">🔍</span>
                        <h2>No operators found</h2>
                        <p>Try searching for something else or clearing filters.</p>
                        <button id="clear-search" class="btn btn-outline">Clear Search</button>
                    </div>
                </section>
            </main>

            <footer class="main-footer">
                <p>&copy; 2026 Python Operators Reference. Built for speed and clarity.</p>
            </footer>
        </div>
    </div>

    <button id="theme-toggle" class="btn btn-icon theme-fab" aria-label="Toggle dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor"
                d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20l0,2c0,0.55,0.45,1,1,1s1-0.45,1-1l0-2c0-0.55-0.45-1-1-1S11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0s-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L18.36,16.95z M5.99,19.42l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41S6.38,19.03,5.99,19.42z M18.36,7.05l1.06-1.06c0.39-0.39,0.39-1.03,0-1.41s-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41S17.97,7.44,18.36,7.05z" />
        </svg>
    </button>
    <script src="app.js"></script>
</body>

</html>
